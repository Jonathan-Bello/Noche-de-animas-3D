<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Noche de Ánimas · Propuestas de apariencias</title>
<style>*{box-sizing:border-box}body{margin:0;background:#d9d6cf;color:#302934;font:15px system-ui}canvas{display:block}header{position:absolute;left:30px;top:25px;z-index:2}h1{font:29px Georgia;margin:0 0 8px}p{line-height:1.5;margin:6px 0}aside{position:absolute;left:25px;top:115px;max-width:270px;background:#f0e9dccc;border:1px solid #b9b0a2;padding:16px;border-radius:8px}h2{font:23px Georgia;margin:0 0 10px}nav{position:absolute;left:25px;right:25px;bottom:20px;display:flex;gap:7px;flex-wrap:wrap}button,select{padding:10px 12px;border:1px solid #b3a99c;border-radius:6px;background:#f8f0df;color:#302934;font:14px system-ui;cursor:pointer}.label{position:absolute;transform:translateX(-50%);text-align:center;font:23px Georgia;white-space:nowrap}.label small{display:block;font:15px system-ui;color:#6c5a65}#labels{position:absolute;inset:0;pointer-events:none}body.capture header,body.capture aside,body.capture nav{display:none}body.gallery aside{display:none}#title{position:absolute;left:4%;top:3%;font:bold 33px system-ui}#note{position:absolute;left:4%;top:7%;font:21px system-ui}</style>
<script type="importmap">{"imports":{"three":"../vendor/three.module.js"}}</script>
<header><h1>Ánimas · Seis propuestas 3D</h1><p>Mismas apariencias, otra construcción visual · Pendientes de valoración</p></header>
<aside><h2 id="name"></h2><p id="idea"></p><p id="motion"></p></aside><div id="labels"></div>
<nav><button id="all">Las seis</button><select id="look"></select><button id="compare">Actual / propuesta</button><button id="states">Tres estados</button><button data-state="rest">Reposo</button><button data-state="hunt">Cacería</button><button data-state="fade">Desvanecer</button><button data-view="front">Frente</button><button data-view="back">Espalda</button><button id="export">Exportar propuesta GLB</button></nav>
<script type="module">
import * as THREE from '../vendor/three.module.js';import{OrbitControls}from '../vendor/OrbitControls.js';import{GLTFExporter}from '../vendor/GLTFExporter.js';import{LOOKS,NOTES,makeProposal,animateGhostRig}from './propuestas.js';
const q=new URLSearchParams(location.search),capture=q.has('capture');if(capture)document.body.classList.add('capture');
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setPixelRatio(capture?1:Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);renderer.setClearColor('#d9d6cf');renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.NoToneMapping;document.body.append(renderer.domElement);
const scene=new THREE.Scene(),camera=new THREE.OrthographicCamera(-2,2,1.5,-1.5,.01,40),controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,1.1,0);controls.enableDamping=true;
scene.add(new THREE.AmbientLight(0xffffff,1.5));const key=new THREE.DirectionalLight(0xffefd9,2.1);key.position.set(-3,6,4);scene.add(key);const fill=new THREE.DirectionalLight(0xd9e6ff,.6);fill.position.set(3,3,-3);scene.add(fill);
let look=q.get('id')||'velo',mode=q.has('compare')?'compare':q.has('states')?'states':q.has('gallery')?'gallery':'single',phase=q.get('state')||'rest',rigs=[],angle=q.get('view')==='back'?Math.PI:0;
const labels=document.querySelector('#labels'),select=document.querySelector('#look');for(const id of LOOKS){const o=document.createElement('option');o.value=id;o.textContent=NOTES[id].name;select.append(o);}select.value=look;
function label(text,x,y){const d=document.createElement('div');d.className='label';d.style.left=x+'%';d.style.top=y+'%';d.innerHTML=text;labels.append(d);}
function state(p,t){return{x:p==='hunt'?t*3:0,y:0,t,dt:1/60,hunt:p==='hunt',blind:false,stunned:false,op:p==='fade'?.20:1};}
function add(id,x,y,p,original=false){const r=makeProposal(id,{original});for(let j=0;j<140;j++)animateGhostRig(r,state(p,j/60));r.g.position.set(x,y,0);r.g.rotation.y=angle;scene.add(r.g);rigs.push({r,p});return r;}
function setup(){for(const {r}of rigs)scene.remove(r.g);rigs=[];labels.innerHTML='';document.body.classList.toggle('gallery',mode==='gallery');controls.enabled=mode==='single';
 if(mode==='gallery'){LOOKS.forEach((id,i)=>{const row=i<3?0:1,col=i%3;add(id,(col-1)*2.5,row===0?3:0,phase);label(NOTES[id].name+'<small>PROPUESTA 3D</small>',50+(col-1)*2.5/(6.6*innerWidth/innerHeight)*100,row===0?48:94);});const t=document.createElement('div');t.id='title';t.textContent='NOCHE DE ÁNIMAS · SEIS APARIENCIAS';labels.append(t);const n=document.createElement('div');n.id='note';n.textContent='Propuestas de silueta y materiales · estilo facetado mate · pendientes de valoración';labels.append(n);}
 else if(mode==='compare'){add(look,-.95,0,phase,true);add(look,.95,0,phase);label('ACTUAL',28,93);label('PROPUESTA',72,93);}
 else if(mode==='states'){for(const[i,p]of['rest','hunt','fade'].entries()){add(look,(i-1)*1.4,0,p);label(['REPOSO','CACERÍA','DESVANECER'][i],[21,50,79][i],93);}}
 else add(look,0,0,phase);
 document.querySelector('#name').textContent=NOTES[look].name;document.querySelector('#idea').textContent=NOTES[look].idea;document.querySelector('#motion').textContent=NOTES[look].motion;select.value=look;resize();}
function resize(){const h=mode==='gallery'?6.6:mode==='states'?3.35:3.15,w=h*innerWidth/innerHeight;camera.left=-w/2;camera.right=w/2;camera.top=h/2;camera.bottom=-h/2;const target=mode==='gallery'?2.85:1.1;controls.target.set(0,target,0);camera.position.set(0,target,8);camera.lookAt(controls.target);camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);controls.update();}
select.onchange=()=>{look=select.value;mode='single';setup();};document.querySelector('#all').onclick=()=>{mode='gallery';setup();};document.querySelector('#compare').onclick=()=>{mode='compare';setup();};document.querySelector('#states').onclick=()=>{mode='states';setup();};document.querySelectorAll('[data-state]').forEach(b=>b.onclick=()=>{phase=b.dataset.state;setup();});document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{angle=b.dataset.view==='back'?Math.PI:0;setup();});addEventListener('resize',resize);
async function exportGLB(){const r=makeProposal(look);return await new GLTFExporter().parseAsync(r.g,{binary:true,onlyVisible:true});}
document.querySelector('#export').onclick=async()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([await exportGLB()],{type:'model/gltf-binary'}));a.download='propuesta_anima_'+look+'.glb';a.click();};
setup();let last=performance.now(),time=0;function loop(now){requestAnimationFrame(loop);const dt=Math.min((now-last)/1000,.05);last=now;time+=dt;if(!capture)for(const {r,p}of rigs)animateGhostRig(r,{...state(p,time),dt});controls.update();renderer.render(scene,camera);}requestAnimationFrame(loop);window.ghostReview={LOOKS,NOTES,exportGLB,rigs,makeProposal};
</script></html>
