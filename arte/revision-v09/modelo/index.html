<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Noche de Ánimas · Elenco v07</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#dad9d7;color:#302c34;font:14px system-ui}canvas{display:block}header{position:absolute;top:22px;left:28px;z-index:2;pointer-events:none}h1{font:29px Georgia;margin:0 0 7px}header p{margin:0;max-width:850px}aside{position:absolute;top:115px;left:25px;max-width:255px;background:#eeeae2ed;border:1px solid #b5afa6;border-radius:10px;padding:17px;z-index:3}aside h2{font:23px Georgia;margin:0 0 10px}aside p{line-height:1.5;margin:8px 0}aside img{width:100%;max-height:190px;object-fit:contain;background:#25212c}nav{position:absolute;left:25px;right:25px;bottom:20px;display:flex;gap:6px;flex-wrap:wrap;z-index:4}button,select,a.button{font:13px system-ui;border:1px solid #aaa397;border-radius:6px;padding:9px 11px;background:#f6f1e8;color:#302c34;cursor:pointer;text-decoration:none}button.active{background:#285953;color:#fff2d9}#labels{position:absolute;inset:0;pointer-events:none}.label{position:absolute;text-align:center;transform:translateX(-50%);white-space:nowrap;font-size:15px}.label b{display:block;font-size:19px}.label small{color:#635964}#stats{position:absolute;right:25px;top:25px;font-size:12px}body.capture header,body.capture aside,body.capture nav,body.capture #stats{display:none}#error{color:#a52c40}body.gallery aside{display:none}body.gallery header h1{font-family:system-ui;font-weight:750}#sheetTitle{position:absolute;left:4%;top:3%;font-size:32px;font-weight:750}#sheetNote{position:absolute;left:4%;top:7%;font-size:20px;max-width:90%}@media(max-width:800px){aside{max-width:190px;top:105px;padding:10px}aside img{max-height:110px}h1{font-size:22px}}
</style>
<script type="importmap">{"imports":{"three":"../vendor/three.module.js"}}</script>
<header><h1>NOCHE DE ÁNIMAS · REVISIÓN DE MALLAS v09</h1><p>Costuras y ropa en movimiento · Abstracción inspirada en Ashen · Rostros sin ojos ni boca · Arrastra para girar</p><p id="error"></p></header>
<aside><h2 id="name"></h2><p id="silhouette"></p><p id="hair"></p><p id="key"></p><img id="ref" alt="Referencia artística original"><p id="approval"></p></aside>
<div id="stats"></div><div id="labels"></div>
<nav><button id="gallery">Todos</button><select id="char"></select><button data-view="three">Tres cuartos</button><button data-view="front">Frente</button><button data-view="side">Perfil</button><button data-view="back">Espalda</button><button data-view="face">Cabello</button><button id="sheet">Hoja 3 vistas</button><button data-pose="neutral">Reposo</button><button data-pose="walk">Caminar</button><button data-pose="run">Correr</button><button data-pose="tool">Equipo</button><button data-pose="crouch">Agacharse</button><button id="original">Antes / reparación</button><button id="wire">Malla</button><button id="sil">Silueta</button><button id="export">Exportar GLB reparado</button></nav>
<script type="module">
import * as THREE from '../vendor/three.module.js';import{OrbitControls}from '../vendor/OrbitControls.js';import{GLTFExporter}from '../vendor/GLTFExporter.js';
import{CHARS,IDS,DESIGN,makeReviewCharacter,animateCharacter}from './elenco.js';
const q=new URLSearchParams(location.search),capture=q.has('capture');if(capture)document.body.classList.add('capture');
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setPixelRatio(capture?1:Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);renderer.setClearColor('#dad9d7');renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.NoToneMapping;document.body.append(renderer.domElement);
const scene=new THREE.Scene(),camera=new THREE.OrthographicCamera(-2,2,1.2,-1.2,.01,80),controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.target.set(0,.9,0);controls.minZoom=.5;controls.maxZoom=5;
const ambient=new THREE.AmbientLight(0xffffff,1.9),key=new THREE.DirectionalLight(0xfff4df,1.6),fill=new THREE.DirectionalLight(0xd7e5ff,.5);key.position.set(-3,6,5);fill.position.set(3,3,-3);scene.add(ambient,key,fill);
let rigs=[],rig,id=q.get('id')||'sensitivo',pose=q.get('pose')||'neutral',mode=q.has('sheet')?'sheet':q.has('gallery')?'gallery':'single',isOriginal=q.has('original'),viewName=q.get('view')||'three',wire=false,sil=false;
const labels=document.querySelector('#labels'),select=document.querySelector('#char');for(const v of IDS){const o=document.createElement('option');o.value=v;o.textContent=DESIGN[v].title;select.append(o);}select.value=id;
function label(text,x,y){const d=document.createElement('div');d.className='label';d.style.left=x+'%';d.style.top=y+'%';d.innerHTML=text;labels.append(d);}
function addRig(id,original=false){const r=makeReviewCharacter(id,{original});r.seed=0;scene.add(r.g);rigs.push(r);if(pose!=='neutral')for(let k=0;k<135;k++)animateCharacter(r,state(pose,k/60,1/60));return r;}
function state(p,t,dt){return{x:(p==='walk'?2.2:p==='run'?3.7:0)*t,y:0,t,dt,hidden:p==='crouch',dead:p==='dead'||p==='spirit',manifest:p==='spirit',lamp:p==='tool',holding:p==='tool',aim:p==='tool',tremble:0};}
function setup(){for(const r of rigs)scene.remove(r.g);rigs=[];labels.innerHTML='';document.body.classList.toggle('gallery',mode==='gallery');controls.enabled=mode==='single';
 if(mode==='gallery'){
  for(let i=0;i<IDS.length;i++){const row=i<7?0:1,col=row===0?i:i-7,n=row===0?7:6,r=addRig(IDS[i]);r.g.position.set((col-(n-1)/2)*.78,row===0?2.10:-.13,0);r.g.rotation.y=q.get('view')==='back'?Math.PI:.12;
   const x=50+((col-(n-1)/2)*.78)/Math.max(5.2*innerWidth/innerHeight,6.64)*100;label(`<b>${DESIGN[IDS[i]].title}</b><small>APROBADO${IDS[i]==='tecnico'?' · MORADO':''}</small>`,x,row===0?52.2:96);
  }rig=rigs[0];ambient.intensity=2.2;key.intensity=1;fill.intensity=.3;
  const d=document.createElement('div');d.id='sheetTitle';d.textContent='NOCHE DE ÁNIMAS · REVISIÓN DE MALLAS v09';labels.append(d);const n=document.createElement('div');n.id='sheetNote';n.textContent='13 modelos 3D · siluetas, cabello y ropa por capas · propuestas para correcciones';labels.append(n);
 }else if(mode==='sheet'){
  for(const [j,angle]of[0,-Math.PI/2,Math.PI].entries()){const r=addRig(id,isOriginal);r.g.position.x=(j-1)*.93;r.g.rotation.y=angle;}rig=rigs[0];ambient.intensity=2.5;key.intensity=.3;fill.intensity=.15;
  const d=document.createElement('div');d.id='sheetTitle';d.textContent=DESIGN[id].title.toUpperCase()+' · v07';labels.append(d);const n=document.createElement('div');n.id='sheetNote';n.textContent=DESIGN[id].key;labels.append(n);for(let j=0;j<3;j++)label('<b>'+['FRENTE','PERFIL','ESPALDA'][j]+'</b>',[22,50,78][j],93);
 }else{rig=addRig(id,isOriginal);ambient.intensity=1.9;key.intensity=1.6;fill.intensity=.5;}
 const d=DESIGN[id];document.querySelector('#name').textContent=d.title;document.querySelector('#silhouette').textContent=d.silhouette;document.querySelector('#hair').textContent=d.hair;document.querySelector('#key').textContent=d.key;
 document.querySelector('#ref').src='../../../juego/assets/a/'+CHARS[id].img+(CHARS[id].rol?'_vivo':'')+'.webp';document.querySelector('#approval').textContent=id==='curandero'?'Curandero aprobado e integrado.':'Costuras y ropa en movimiento en el juego.';
 document.querySelector('#original').classList.toggle('active',isOriginal);select.value=id;resize();view(viewName);updateStats();
 if(wire)rigs.forEach(r=>r.g.traverse(o=>{if(o.isMesh)for(const m of(Array.isArray(o.material)?o.material:[o.material]))m.wireframe=true;}));
 if(sil){scene.overrideMaterial=new THREE.MeshBasicMaterial({color:'#28222c'});}else scene.overrideMaterial=null;
}
function updateStats(){let tris=0;for(const r of rigs)r.g.traverse(o=>{if(o.isMesh&&o.visible)tris+=(o.geometry.index?o.geometry.index.count:o.geometry.attributes.position.count)/3;});document.querySelector('#stats').textContent=`${Math.round(tris)} triángulos · ${isOriginal?'MODELO ANTERIOR':'REVISIÓN v07'}`;}
function resize(){let h=mode==='gallery'?5.2:mode==='sheet'?2.55:2.35,w=h*innerWidth/innerHeight;if(mode==='gallery')w=Math.max(w,6.64);camera.left=-w/2;camera.right=w/2;camera.top=h/2;camera.bottom=-h/2;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);}
function view(v){viewName=v;camera.zoom=mode==='single'&&v==='face'?3.5:1;
 if(mode==='gallery'){camera.position.set(0,2.14,8);controls.target.set(0,2.14,0);}
 else if(mode==='sheet'){camera.position.set(0,.93,8);controls.target.set(0,.93,0);}
 else{const y=v==='face'?1.56:.88;controls.target.set(0,y,0);camera.position.set(...({three:[3,1.95,5],front:[0,y,5],side:[5,y,0],back:[0,y,-5],face:[.4,1.62,5]}[v]||[3,1.95,5]));}
 camera.lookAt(controls.target);controls.update();camera.updateProjectionMatrix();}
addEventListener('resize',()=>{resize();view(viewName);});select.onchange=()=>{id=select.value;mode='single';isOriginal=false;setup();};document.querySelector('#gallery').onclick=()=>{mode='gallery';pose='neutral';setup();};document.querySelector('#sheet').onclick=()=>{mode=mode==='sheet'?'single':'sheet';setup();};
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{if(mode!=='single')mode='single';viewName=b.dataset.view;setup();});document.querySelectorAll('[data-pose]').forEach(b=>b.onclick=()=>{pose=b.dataset.pose;setup();});document.querySelector('#original').onclick=()=>{isOriginal=!isOriginal;mode='single';setup();};document.querySelector('#wire').onclick=()=>{wire=!wire;setup();};document.querySelector('#sil').onclick=()=>{sil=!sil;setup();};
async function exportGLB(r=rig){const pos=r.g.position.clone(),rot=r.g.rotation.clone();r.g.position.set(0,0,0);r.g.rotation.set(0,0,0);const result=await new GLTFExporter().parseAsync(r.g,{binary:true,onlyVisible:true});r.g.position.copy(pos);r.g.rotation.copy(rot);return result;}
document.querySelector('#export').onclick=async()=>{const r=mode==='gallery'?makeReviewCharacter(id):rig,a=document.createElement('a');a.href=URL.createObjectURL(new Blob([await exportGLB(r)],{type:'model/gltf-binary'}));a.download=id+'_v07.glb';a.click();};
setup();let last=performance.now(),time=0;function loop(now){requestAnimationFrame(loop);const dt=Math.min((now-last)/1000,.05);last=now;time+=dt;if(!capture&&pose!=='neutral')for(const r of rigs)animateCharacter(r,state(pose,time,dt));controls.update();renderer.render(scene,camera);}requestAnimationFrame(loop);
window.review={get rig(){return rig;},makeReviewCharacter,CHARS,IDS,DESIGN,animateCharacter,exportGLB,select:(v)=>{id=v;mode='single';setup();}};
</script></html>
