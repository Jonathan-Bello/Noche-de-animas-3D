<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Instrumentos V14</title><style>body{margin:0;background:#e8dfcf;font:17px system-ui;color:#303b37}main{max-width:1100px;margin:auto;padding:24px}button,select{font:inherit;padding:8px;margin:5px}canvas{max-width:100%;display:block}p{max-width:850px}</style><main><h1>Instrumentos · modelos V14</h1><select id="kind"><option value="termo">Termómetro</option><option value="uv">Lámpara UV</option><option value="grab">Grabadora</option><option value="cam">Cámara con tripié</option><option value="emf">Detector EMF</option><option value="espejo">Espejo</option><option value="gases">Detector de gases</option></select><label><input type="checkbox" id="held"> En la mano</label><p id="note"></p><div id="view"></div><p>Gira el modelo arrastrando. Son las mismas piezas que usa el juego. Los datos de demostración del visor no alteran las reglas de evidencia.</p><a href="../../juego/">Jugar</a> · <a href="../../editor/">Taller de la casona</a></main><script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';globalThis.THREE=THREE;await import('../../src/tools-art3d.js');const art=globalThis.NDAToolArt,scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(35,1.6,.01,20),renderer=new THREE.WebGLRenderer({antialias:true});scene.background=new THREE.Color('#e8dfcf');renderer.setSize(960,600);renderer.setPixelRatio(Math.min(devicePixelRatio,1.35));document.getElementById('view').append(renderer.domElement);scene.add(new THREE.HemisphereLight(0xffffff,0x655e52,3));const light=new THREE.DirectionalLight(0xffffff,2);light.position.set(2,4,3);scene.add(light);camera.position.set(.9,.7,1.1);camera.lookAt(0,.22,0);let model,angle=0;const notes={termo:'Cuerpo de mano y lectura asentada en la pantalla del juego.',uv:'Empuñadura y cabeza violeta; ilumina puertas y ceniza.',grab:'Grabadora con rejilla y pantalla; pregunta y escucha según las condiciones del cuarto.',cam:'Cámara orientada al cuarto. Tripié desplegado al colocarla; la evidencia se observa en la tele de la base.',emf:'Cinco pilotos individuales; el nivel 4 puede ser interferencia y el 5 es evidencia.',espejo:'Marco octagonal y mango; conserva el vaho y la marca de mano del sistema actual.',gases:'Detector con entrada y aguja; amarillo y rojo conservan su significado actual.'};function render(){const k=document.getElementById('kind').value;if(model){scene.remove(model);model.traverse(o=>{o.geometry?.dispose();o.material?.dispose();});}model=art.create(k);model.rotation.y=angle;scene.add(model);art.update(model,{emfUntil:10,emfLvl:3,redUntil:0,yellowUntil:10},1,document.getElementById('held').checked);document.getElementById('note').textContent=notes[k];renderer.render(scene,camera);}document.getElementById('kind').onchange=render;document.getElementById('held').onchange=render;let drag=false;renderer.domElement.onpointerdown=e=>{drag=true;renderer.domElement.setPointerCapture(e.pointerId)};renderer.domElement.onpointermove=e=>{if(drag){angle+=e.movementX*.015;model.rotation.y=angle;renderer.render(scene,camera);}};renderer.domElement.onpointerup=()=>drag=false;render();
</script></html>
