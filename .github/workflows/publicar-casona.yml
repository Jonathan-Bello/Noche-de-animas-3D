name: Publicar casona y validar editor
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: casona-publicacion
  cancel-in-progress: false
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validar propuesta y preparar página
        run: python tools/publish_editor.py
      - name: Guardar resultado en el repositorio
        run: |
          git config user.name "Casona editor"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/layout-v11.json juego/index.html arte/modulos-casona editor-publications/status.json
          if ! git diff --cached --quiet; then
            git commit -m "Aplicar resultado validado del editor público"
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Actualizar juego público
        id: deployment
        uses: actions/deploy-pages@v4
